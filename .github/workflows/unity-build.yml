# Real-Unity CI with GameCI (see docs/CI.md): EditMode + PlayMode tests, an Android App Bundle and an iOS Xcode
# project, built in the unityci/editor Docker images for the editor version in ProjectSettings/ProjectVersion.txt.
#
# Needs Unity license secrets. Without them the preflight job only posts a notice and everything else is skipped
# (the workflow stays green). Android release signing is optional (debug keystore otherwise).
name: Unity build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [android-and-ios, android, ios]
        default: android-and-ios
      run_tests:
        description: Run the EditMode + PlayMode tests first (the builds only start when they pass)
        type: boolean
        default: true
      version:
        description: bundleVersion for this build, e.g. 1.2.0 (blank = the tag on a v* tag, else the ProjectSettings value)
        type: string
        default: ''
      android_version_code:
        description: Android versionCode (blank = major*1000000 + minor*1000 + patch of the version; ProjectSettings value when no version is given)
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

# One Unity run at a time for the whole repository (one license seat), queued instead of cancelled: a job killed
# mid-run can leave a Unity Personal seat activated. (GitHub keeps one pending run; a newer one replaces it.)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # game-ci/cli release run by unity-test-runner@v4 / unity-builder@v6 (default "latest"); pinned for reproducible runs.
  GAMECI_CLI_VERSION: v0.1.69

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Preflight (Unity license secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unity: ${{ steps.license.outputs.available }}
      signing: ${{ steps.signing.outputs.enabled }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Check Unity license secrets
        id: license
        env:
          HAS_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_UNITY_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
          HAS_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          # The same order game-ci/cli resolves the activation method in (dist/platforms/ubuntu/steps/licensing_method.sh).
          method=""
          if [ "$HAS_UNITY_SERIAL" = true ] && [ "$HAS_UNITY_EMAIL" = true ] && [ "$HAS_UNITY_PASSWORD" = true ]; then
            method="serial - Unity Pro/Plus seat (UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD)"
          elif [ "$HAS_UNITY_LICENSE" = true ]; then
            method="license file - UNITY_LICENSE (.ulf)"
          elif [ "$HAS_UNITY_EMAIL" = true ] && [ "$HAS_UNITY_PASSWORD" = true ]; then
            method="personal - Unity Personal seat via the Unity account (UNITY_EMAIL + UNITY_PASSWORD)"
          fi
          if [ -z "$method" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            msg="No Unity license secrets: set UNITY_EMAIL + UNITY_PASSWORD (Unity Personal; add UNITY_SERIAL for Pro/Plus, or UNITY_LICENSE for a .ulf) in Settings > Secrets and variables > Actions. Tests and builds were skipped - see docs/CI.md."
            echo "::notice title=Unity build skipped::$msg"
            printf '### Unity build skipped\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Unity license::GameCI activation method: $method"

      - name: Check Android signing secrets
        id: signing
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS != '' }}
          HAS_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME != '' }}
          HAS_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS != '' }}
        run: |
          set -- "$HAS_KEYSTORE" "$HAS_KEYSTORE_PASS" "$HAS_KEYALIAS_NAME" "$HAS_KEYALIAS_PASS"
          case "$*" in
            "true true true true")
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Android signing::Release keystore from ANDROID_KEYSTORE_BASE64" ;;
            *true*)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Android signing::Incomplete signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME and ANDROID_KEYALIAS_PASS are all needed) - building with the debug keystore" ;;
            *)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Android signing::No keystore secrets - the .aab is signed with the debug keystore (not uploadable to Google Play)" ;;
          esac

      - name: Select platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          android='{"targetPlatform":"Android","fieldBuild":"aab"}'
          ios='{"targetPlatform":"iOS","fieldBuild":"ios"}'
          case "$PLATFORMS" in
            android) matrix="[$android]" ;;
            ios) matrix="[$ios]" ;;
            *) matrix="[$android,$ios]" ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.license.outputs.available == 'true'
        with:
          sparse-checkout: BeamRunner/ProjectSettings/ProjectVersion.txt
          sparse-checkout-cone-mode: false

      # Early, readable warning when ProjectVersion.txt names an editor GameCI has not published images for.
      - name: Check GameCI editor images
        if: steps.license.outputs.available == 'true'
        run: |
          version=$(sed -n 's/^m_EditorVersion: *//p' BeamRunner/ProjectSettings/ProjectVersion.txt | tr -d '\r')
          echo "Unity $version"
          for module in linux-il2cpp android ios; do
            tag="ubuntu-$version-$module-3"
            if curl -fsS -m 30 -o /dev/null "https://hub.docker.com/v2/repositories/unityci/editor/tags/$tag"; then
              echo "found unityci/editor:$tag"
            else
              echo "::warning title=GameCI image::unityci/editor:$tag not found on Docker Hub (or Docker Hub unreachable)"
            fi
          done

  test:
    name: Tests (EditMode + PlayMode)
    needs: preflight
    if: needs.preflight.outputs.unity == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write   # unity-test-runner posts the results as a check run
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space for the Unity editor image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/cache@v6
        with:
          path: BeamRunner/Library
          key: unity-library-tests-${{ hashFiles('BeamRunner/Assets/**', 'BeamRunner/Packages/**', 'BeamRunner/ProjectSettings/**') }}
          restore-keys: unity-library-tests-

      - name: Run EditMode + PlayMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: ${{ env.GAMECI_CLI_VERSION }}
          projectPath: BeamRunner
          testMode: all            # playmode;editmode, combined results
          coverageEnabled: false   # the project has no com.unity.testtools.codecoverage package
          githubToken: ${{ github.token }}
          checkName: Unity test results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath || 'artifacts' }}
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: [preflight, test]
    # Runs when the tests passed or were skipped on purpose (run_tests = false), never without a license.
    if: >-
      !cancelled() && needs.preflight.outputs.unity == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1   # one Unity activation at a time (Unity Personal has very few seats)
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space for the Unity editor image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/cache@v6
        with:
          path: BeamRunner/Library
          key: unity-library-${{ matrix.targetPlatform }}-${{ hashFiles('BeamRunner/Assets/**', 'BeamRunner/Packages/**', 'BeamRunner/ProjectSettings/**') }}
          restore-keys: unity-library-${{ matrix.targetPlatform }}-

      # Builds through the project's own FieldBuildMenu.BuildFromCommandLine (pre-flight validation, Main scene first,
      # the same options as the editor menu); it maps GameCI's -customBuildPath, -buildVersion, -androidVersionCode
      # and keystore arguments. Versioning: explicit `version` input > v* tag > ProjectSettings (None).
      - name: Build
        id: build
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: ${{ env.GAMECI_CLI_VERSION }}
          projectPath: BeamRunner
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: BeamRunner
          buildsPath: build
          buildMethod: BeamRunner.EditorTools.FieldBuildMenu.BuildFromCommandLine
          customParameters: -fieldBuild ${{ matrix.fieldBuild }}
          versioning: ${{ inputs.version != '' && 'Custom' || startsWith(github.ref, 'refs/tags/v') && 'Tag' || 'None' }}
          version: ${{ inputs.version }}
          androidVersionCode: ${{ inputs.android_version_code }}
          androidExportType: androidAppBundle
          androidKeystoreName: ${{ matrix.targetPlatform == 'Android' && needs.preflight.outputs.signing == 'true' && 'beamrunner-ci.keystore' || '' }}
          androidKeystoreBase64: ${{ matrix.targetPlatform == 'Android' && needs.preflight.outputs.signing == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          androidKeystorePass: ${{ matrix.targetPlatform == 'Android' && needs.preflight.outputs.signing == 'true' && secrets.ANDROID_KEYSTORE_PASS || '' }}
          androidKeyaliasName: ${{ matrix.targetPlatform == 'Android' && needs.preflight.outputs.signing == 'true' && secrets.ANDROID_KEYALIAS_NAME || '' }}
          androidKeyaliasPass: ${{ matrix.targetPlatform == 'Android' && needs.preflight.outputs.signing == 'true' && secrets.ANDROID_KEYALIAS_PASS || '' }}

      # Google Play rejects apps targeting Android 15+ whose 64-bit native libraries are not 16 KB page-aligned.
      - name: Check 16 KB page-size compatibility
        if: matrix.targetPlatform == 'Android'
        run: python3 tools/check-16kb.py build/Android/BeamRunner.aab

      # (unity-builder's buildVersion/androidVersionCode outputs are not populated by game-ci/cli v0.1.69; the
      # "[BeamRunner] Command-line build: ..." line of the Build step log has the version actually used.)
      - name: Summary
        if: always() && steps.build.outcome != 'skipped'
        env:
          PLATFORM: ${{ matrix.targetPlatform }}
          OUTCOME: ${{ steps.build.outcome }}
          VERSIONING: ${{ inputs.version != '' && format('custom {0}', inputs.version) || startsWith(github.ref, 'refs/tags/v') && format('tag {0}', github.ref_name) || 'ProjectSettings' }}
          SIGNING: ${{ needs.preflight.outputs.signing == 'true' && 'release keystore' || 'debug keystore' }}
        run: |
          {
            echo "### $PLATFORM build: $OUTCOME"
            echo "- version from: $VERSIONING"
            if [ "$PLATFORM" = Android ]; then echo "- signing: $SIGNING"; fi
            echo '```'
            find build -maxdepth 2 2>/dev/null | sort || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: BeamRunner-${{ matrix.targetPlatform }}
          path: |
            build/${{ matrix.targetPlatform }}
            !build/*/*_BurstDebugInformation_DoNotShip
            !build/*/*_BackUpThisFolder_ButDontShipItWithYourGame
          if-no-files-found: error
          retention-days: 14
